[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybergym-agent"
version = "0.1.0"
description = "Cost-sensitive PoV-reproduction agent for the CyberGym benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["cybergym @ file://third_party/cybergym-upstream"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["agent*", "eval*", "report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
